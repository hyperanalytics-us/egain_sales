# Apache reverse proxy for ESP mounted at https://javasri.com/esp
#
# Use this when ESP runs as its own process (uvicorn on 127.0.0.1:8800) and
# Apache only forwards to it - i.e. on a VPS, or a host that allows long-running
# processes. Put it in public_html/.htaccess. Requires mod_proxy + mod_proxy_http.
#
# With cPanel "Setup Python App" you do NOT need this: Passenger mounts the app
# at the Application URL for you.

RewriteEngine On

# /esp -> /esp/ so relative asset URLs resolve correctly.
RewriteRule ^esp$ /esp/ [R=301,L]

# Forward everything under /esp/ to the ESP process, stripping the prefix.
RewriteCond %{REQUEST_URI} ^/esp/
RewriteRule ^esp/(.*)$ http://127.0.0.1:8800/$1 [P,QSA,L]

# Preserve the original scheme so ESP marks its session cookie Secure.
RequestHeader set X-Forwarded-Proto "https" env=HTTPS
