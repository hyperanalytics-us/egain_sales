# Drop this in the data/ directory as .htaccess if - and only if - ESP's data
# directory ends up inside a web-served path.
#
# data/ holds uploaded weblogs, the analysed SQLite databases and the session
# signing key. None of it should ever be fetchable over HTTP.

Require all denied

<IfModule !mod_authz_core.c>
  Order allow,deny
  Deny from all
</IfModule>
