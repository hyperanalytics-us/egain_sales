
# --- ESP: block direct web access to application internals -------------------
# Only needed when the application root sits inside a web-served directory.
# Passenger serves the app itself; none of these paths should ever be fetchable.

<IfModule mod_rewrite.c>
  RewriteEngine On
  RewriteRule ^(data|esp|scripts|deploy|tmp)/ - [F,L]
  RewriteRule ^(\.env|passenger_wsgi\.py|requirements.*\.txt|.*\.md)$ - [F,L]
</IfModule>

<FilesMatch "\.(py|pyc|db|sqlite3?|env|log|json|md)$">
  Require all denied
  <IfModule !mod_authz_core.c>
    Order allow,deny
    Deny from all
  </IfModule>
</FilesMatch>

# The single-page UI still needs its assets, so re-allow the static directory.
<IfModule mod_rewrite.c>
  RewriteRule ^static/ - [L]
</IfModule>
